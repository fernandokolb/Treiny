<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treiny</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Treiny">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101318" media="(prefers-color-scheme: dark)">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna estreita tipo app, cartões por exercício, barra de abas fixa e cronômetro de descanso flutuante */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --sunk:#E2E6EB; --ink:#131820; --muted:#5A6573; --line:#D3D9E0;
  --accent:#B0245A; --accent-ink:#FFFFFF; --accent-soft:#F7DFE8; --ok:#0E7A6E; --ok-soft:#D6EFEA;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Figtree',-apple-system,'Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101318; --surface:#1A1F27; --sunk:#232A34; --ink:#ECEFF3; --muted:#98A2AF; --line:#2C333E;
  --accent:#F0679A; --accent-ink:#1C0E15; --accent-soft:#3B2030; --ok:#3CC2AE; --ok-soft:#173632; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#1A1F27; --sunk:#232A34; --ink:#ECEFF3; --muted:#98A2AF; --line:#2C333E;
  --accent:#F0679A; --accent-ink:#1C0E15; --accent-soft:#3B2030; --ok:#3CC2AE; --ok-soft:#173632; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px 190px;display:grid;gap:18px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.brand h1 b{color:var(--accent)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);flex:0 0 auto;object-fit:contain}
.meta{color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.week{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.week::-webkit-scrollbar{display:none}
.daybtn{flex:0 0 auto;min-width:58px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px 8px;display:grid;justify-items:center}
.daybtn small{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.daybtn span{font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.daybtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daybtn[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.daybtn.done:not([aria-pressed="true"]){border-color:var(--ok);background:var(--ok-soft)}
.dayhead{display:grid;gap:8px}
.dayhead h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;margin:0;text-transform:uppercase;text-wrap:balance}
.progress{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);transition:width .3s}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.card.is-done{border-color:var(--ok)}
.card.is-done .name{text-decoration:line-through;text-decoration-color:var(--muted)}
.head{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:12px;align-items:start}
.hl{display:grid;gap:2px;min-width:0}
.hl .row{gap:8px}
.vbox{position:relative;width:112px;aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;background:#101318;border:0;padding:0;display:grid;place-items:center;color:#fff}
a.vbox{text-decoration:none}
.vbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.play{position:relative;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;color:#14202E;padding-left:3px}
.vbox small{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:11px;font-weight:600;color:#fff}
.player{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.top>div{min-width:0}
.num{font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted);line-height:1.2;font-variant-numeric:tabular-nums}
.name{font-weight:700;font-size:16px;line-height:1.25}
.musc{font-size:13px;font-weight:600;color:var(--accent);margin-top:2px}
.pat{font-size:12px;color:var(--muted);margin-top:2px}
.status{font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2}
.is-done .status{color:var(--ok)}
.pr{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.check{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center}
.check svg{opacity:0}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check[aria-pressed="true"] svg{opacity:1}
.rx{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--sunk);border-radius:10px;padding:8px 12px}
.sets{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.sets em{font-style:normal;color:var(--accent);margin:0 2px}
.sets small{font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);margin-left:4px}
.rest{font-size:13px;color:var(--muted);font-weight:500}
.prev{font-size:13px;color:var(--muted)}
.prev b{color:var(--ink);font-variant-numeric:tabular-nums}
.tipup{background:var(--ok-soft);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.setgrid{display:grid;grid-template-columns:auto minmax(0,1.7fr) minmax(0,1fr) auto;gap:6px 8px;align-items:center}
.setgrid.t,.setgrid.u{grid-template-columns:auto 1fr auto}
.stepper{display:flex;align-items:stretch;min-width:0}
.stepper .inp{border-radius:0;text-align:center;padding:8px 2px;flex:1;min-width:0}
.stp{width:34px;flex:0 0 34px;border:1px solid var(--line);background:var(--sunk);font-size:19px;font-weight:700;line-height:1;color:var(--ink)}
.stp:first-child{border-radius:10px 0 0 10px;border-right:0}
.stp:last-child{border-radius:0 10px 10px 0;border-left:0}
.loadrow{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.loadrow .stepper{width:176px}
.loadrow .h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.setgrid .h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.setgrid .sn{font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.setgrid .tm{font-size:14px;font-variant-numeric:tabular-nums}
.inp{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font:inherit;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.inp::placeholder{color:var(--muted);opacity:.75}
.sb{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--muted)}
.sb svg{opacity:.35}
.sb[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.sb[aria-pressed="true"] svg{opacity:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-self:start}
.btn.ghost{background:transparent}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
a.btn{text-decoration:none;color:var(--ink)}
.banner{background:var(--ok-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-weight:600}
.warn{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.warn p{margin:0;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:20px 8px;margin:0}
.cardio,.warm{border-style:dashed;border-width:2px}
.cardio .num,.warm .num{color:var(--accent)}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.edit-ctl{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:700}
/* Perfil */
.sec{display:grid;gap:10px}
.sec h3{margin:0;font-size:15px;font-weight:700}
.hint{font-size:13px;color:var(--muted);margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.opt b{font-size:14px}
.opt span{font-size:12px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.daysel{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.daysel button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.daysel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.ban{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
input[type=text].wide,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;color:var(--ink)}
textarea{min-height:84px;font:13px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;resize:vertical}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details+details{margin-top:-2px}
summary{list-style:none;padding:11px 14px;font-weight:600;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary span{color:var(--muted);font-weight:500;font-size:13px}
.exrow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.exrow .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center}
.exrow[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.exrow[aria-pressed="true"] .t{text-decoration:line-through;color:var(--muted)}
.exrow .t{flex:1;min-width:0}
.exrow small{color:var(--muted);font-size:12px}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin:0}
/* Evolução */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{font-family:var(--display);font-weight:700;font-size:28px;display:block;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.big{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.big>div{min-width:0}
.spark{flex:0 0 auto}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:14px}
.box .hrow:first-child{border-top:0}
.hrow>span:first-child{color:var(--muted);text-transform:capitalize;white-space:nowrap}
.grow{flex:1;min-width:0}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:4px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.calhead b{text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted);font-weight:700}
.cal .c{aspect-ratio:1;max-width:100%;border-radius:8px;display:grid;place-items:center;font-size:13px;font-variant-numeric:tabular-nums;background:var(--sunk)}
.cal .c.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal .c.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .c.e{background:transparent}
.bodyform{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.bodyform label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
/* Abas, cronômetro, aviso */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tab{flex:1;max-width:180px;border:0;background:none;border-radius:12px;padding:6px 0;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tab[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.restbar{position:fixed;left:50%;transform:translateX(-50%);width:min(528px,calc(100% - 32px));bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px 14px 16px;display:flex;align-items:center;gap:8px;z-index:6;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.restbar .rl{flex:1;min-width:0;display:grid}
.restbar small{opacity:.7;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.restbar span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restbar b{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.restbar button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.restbar i{position:absolute;left:0;bottom:0;height:4px;background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
#sheet{position:fixed;inset:0;z-index:10;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.panel h2{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;margin:0;line-height:1.05}
.altlist{display:grid;gap:8px}
.alt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;text-align:left;display:grid;gap:2px}
.alt b{font-size:15px}
.alt span{font-size:12px;color:var(--muted)}
.panelfoot{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>
<body>
<main id="view"></main>
<div id="rest" class="restbar" hidden role="timer" aria-live="off">
  <div class="rl"><small>Descanso</small><span></span></div><b>0:00</b>
  <button data-act="rest15">+15 s</button><button data-act="restskip">Pular</button><i></i>
</div>
<nav class="tabs">
  <button class="tab" data-act="tab" data-v="treino" id="tab-treino">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Treino</button>
  <button class="tab" data-act="tab" data-v="evolucao" id="tab-evolucao">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Evolução</button>
  <button class="tab" data-act="tab" data-v="ajustes" id="tab-ajustes">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Meu perfil</button>
</nav>
<div id="sheet" hidden></div>

function spark(l){

}
function lineChart(pts,unit){
  if(pts.length<2)return'';const W=320,H=150,l=44,r=14,t=14,b=26,v=pts.map(p=>p.v);let mn=Math.min(...v),mx=Math.max(...v);if(mn===mx){mn-=1;mx+=1}

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução de ${pts.length} medidas">
    <line x1="${l}" x2="${W-r}" y1="${Y(mx)}" y2="${Y(mx)}" style="stroke:var(--line)"/><line x1="${l}" x2="${W-r}" y1="${Y(mn)}" y2="${Y(mn)}" style="stroke:var(--line)"/>
    <text x="${l-8}" y="${Y(mx)+4}" text-anchor="end" ${T}>${fmtKg(mx)}</text><text x="${l-8}" y="${Y(mn)+4}" text-anchor="end" ${T}>${fmtKg(mn)}</text>

    ${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===pts.length-1?4.5:3}" style="fill:var(--accent)"/>`).join('')}

}
function addList(q){
  const d=S.plan.days[S.day],inDay=new Set(d.items),h=have(),bl=blocked(),n=norm(q||'');
  const list=EX.filter(e=>ok(e,h)&&!S.profile.excluded.includes(e.id)&&!bl.has(e.id)&&!inDay.has(e.id)&&(!n||norm(e.n+' '+musc(e)+' '+P[e.p]).includes(n)));
  if(!list.length)return'<p class="hint">Nada encontrado com os seus equipamentos.</p>';
  return Object.keys(P).map(p=>{const l=list.filter(e=>e.p===p);return l.length?`<div class="eyebrow">${P[p]}</div>${l.map(e=>`<button class="alt" data-act="add" data-id="${e.id}"><b>${e.n}</b><span>${musc(e)} · ${eqLabel(e)}</span></button>`).join('')}`:''}).join('');
}
function openAdd(){
  SH.innerHTML=`<div class="panel" role="dialog" aria-label="Adicionar exercício"><h2>Adicionar exercício</h2>
   <input class="wide" type="text" id="addq" placeholder="Buscar por nome ou músculo" autocomplete="off">
   <div class="altlist" id="addlist">${addList('')}</div>
   <div class="panelfoot"><span></span><button class="btn primary" data-act="close">Fechar</button></div></div>`;
  SH.hidden=false;
}
function banEverywhere(id){
  S.profile.excluded.push(id);
  S.plan.days.forEach(d=>{const k=d.items.indexOf(id);if(k<0)return;const alt=pool(EXM[id].p,new Set(d.items))[0];if(alt)d.items[k]=alt.id;else d.items.splice(k,1)});
}

/* ---------- cronômetro de descanso ---------- */
let RT=null,AC=null,RTh=null;
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function startRest(sec,name){
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
  if(RT&&RT.lock)try{RT.lock.release()}catch(e){}
  RT={end:Date.now()+sec*1000,total:sec,name};clearInterval(RTh);RTh=setInterval(tick,250);tick();
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>{if(RT)RT.lock=w;else w.release()}).catch(()=>{})}catch(e){}
}
function stopRest(){if(RT&&RT.lock)try{RT.lock.release()}catch(e){}RT=null;clearInterval(RTh);$('#rest').hidden=true}
function beep(){if(!AC)return;try{[0,.35,.7].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.frequency.value=880;o.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.35,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.25);o.start(s);o.stop(s+.3)})}catch(e){}}
function tick(){
  const bar=$('#rest');if(!RT){bar.hidden=true;return}
  const left=Math.ceil((RT.end-Date.now())/1000);
  if(left<=0){beep();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}stopRest();toast('Descanso acabou. Próxima série!');return}
  bar.hidden=false;bar.querySelector('b').textContent=mmss(left);bar.querySelector('span').textContent=RT.name;
  bar.querySelector('i').style.width=Math.max(0,Math.min(100,(1-left/RT.total)*100))+'%';
}

/* ---------- backup ---------- */
const encode=o=>'FICHA2:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
function decode(s){try{s=(s||'').trim();if(!s.startsWith('FICHA2:'))return null;const o=JSON.parse(decodeURIComponent(escape(atob(s.slice(7)))));
  return o&&o.profile&&o.plan&&Array.isArray(o.plan.days)&&o.plan.days.every(d=>TPL[d.k]&&Array.isArray(d.items))?o:null}catch(e){return null}}

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}

/* ---------- eventos ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');
  if(!b){if(ev.target===SH)SH.hidden=true;return}
  const a=b.dataset.act,v=b.dataset.v,pr=S.profile,d=S.plan.days[S.day];
  switch(a){
    case'tab':S.view=v;S.edit=false;window.scrollTo(0,0);break;
    case'day':S.day=+b.dataset.i;break;
    case'set':{const id=b.dataset.id,n=+b.dataset.n,e=EXM[id],st=setsOf(id,S.day)[n];
      if(st.done)st.done=false;else{fillSet(id,n,st);st.done=true;startRest(rx(e).rest,e.n)}
      const isPR=record(id);
      if(allDone()&&logSession())toast('Treino concluído! Bom trabalho.');else if(isPR)toast(`Novo recorde em ${e.n}: ${kgTxt(S.log[id][S.log[id].length-1].kg)}!`);
      break}
    case'play':UI.play=b.dataset.id;break;
    case'stopplay':UI.play=null;break;
    case'kstep':{const id=b.dataset.id,n=b.dataset.n==='u'?'u':+b.dataset.n,a=setsOf(id,S.day),i=n==='u'?0:n;
      let base=num(a[i].k);if(base==null){const p=phKg(id,i);base=p===''?0:+p}
      setK(id,n,fmtKg(Math.max(0,base+(+b.dataset.d))));break}
    case'loadmode':pr.loadMode=v;break;
    case'warm':{const c=dayCur(S.day);c._w=!c._w;break}
    case'cardio':{const c=dayCur(S.day);c._c=!c._c;break}
    case'finish':if(logSession())toast('Treino concluído! Bom trabalho.');break;
    case'edit':S.edit=!S.edit;break;
    case'up':case'down':{const i=+b.dataset.i,j=a==='up'?i-1:i+1;if(j<0||j>=d.items.length)return;[d.items[i],d.items[j]]=[d.items[j],d.items[i]];break}
    case'rm':d.items.splice(+b.dataset.i,1);break;
    case'addopen':openAdd();return;
    case'add':d.items.push(b.dataset.id);SH.hidden=true;toast('Exercício adicionado');break;
    case'swap':openSwap(+b.dataset.i);return;
    case'pick':{const i=+b.dataset.i,old=d.items[i];d.items[i]=b.dataset.id;delete dayCur(S.day)[old];SH.hidden=true;break}
    case'banhere':banEverywhere(b.dataset.id);SH.hidden=true;break;
    case'close':SH.hidden=true;return;
    case'variar':S.seed++;build();toast('Exercícios variados');break;
    case'snooze':S.rotSnooze=addDays(today(),7);break;
    case'goal':pr.goal=v;build();break;
    case'level':pr.level=v;build();break;
    case'focus':pr.focus=v;build();break;
    case'days':pr.days=+v;build();break;
    case'equip':case'cequip':case'restr':{const arr=pr[a==='equip'?'equip':a==='cequip'?'cardio':'restr'],k=arr.indexOf(v);k<0?arr.push(v):arr.splice(k,1);if(a!=='cequip')build();break}
    case'ban':{const id=b.dataset.id,k=pr.excluded.indexOf(id);k<0?pr.excluded.push(id):pr.excluded.splice(k,1);build();break}
    case'del':{const id=b.dataset.id;S.log[id]=(S.log[id]||[]).filter(x=>x.d!==b.dataset.d);if(!S.log[id].length)delete S.log[id];break}
    case'cal':S.cal=Math.min(0,S.cal+(+v));break;
    case'metric':S.metric=v;break;
    case'bodysave':{const e={d:today()};let any=false;METRICS.forEach(([k])=>{const x=num($('#b-'+k).value);if(x!=null&&x>0){e[k]=x;any=true}});
      if(!any){toast('Preencha pelo menos uma medida');return}
      const i=S.body.findIndex(x=>x.d===e.d);if(i>=0)Object.assign(S.body[i],e);else S.body.push(e);S.body.sort((x,y)=>x.d<y.d?-1:1);toast('Medidas salvas');break}
    case'bodydel':S.body=S.body.filter(x=>x.d!==b.dataset.d);break;
    case'bkgen':{UI.bk=encode(S);S.lastBackup=today();
      try{navigator.clipboard.writeText(UI.bk).then(()=>toast('Código copiado. Cole nas Notas ou no WhatsApp.'),()=>toast('Selecione o código abaixo e copie'))}catch(e){toast('Selecione o código abaixo e copie')}
      break}
    case'bkrestore':{const o=decode(UI.bkin);if(!o){UI.confirm=false;toast('Código de backup inválido');break}
      if(!UI.confirm){UI.confirm=true;break}
      S=migrate(o);S.view='ajustes';if(S.day>=S.plan.days.length)S.day=0;UI.confirm=false;UI.bkin='';UI.bk='';toast('Backup restaurado');break}
    case'rest15':if(RT){RT.end+=15000;RT.total+=15;tick()}return;
    case'restskip':stopRest();return;
  }
  const y=window.scrollY;render();window.scrollTo(0,y);
  if(a==='bkgen'){const t=$('#bkout');if(t){t.focus();t.select()}}
});
document.addEventListener('toggle',ev=>{const g=ev.target.dataset&&ev.target.dataset.g;if(!g)return;
  S.open=S.open.filter(x=>x!==g);if(ev.target.open)S.open.push(g);save()},true);
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.f==='k'||t.dataset.f==='ku'){const id=t.dataset.ex,n=t.dataset.f==='ku'?'u':+t.dataset.n;
    setK(id,n,t.value).forEach(m=>{if(m!==n){const x=document.getElementById(`k-${id}-${m}`);if(x)x.value=t.value}});save();return}
  if(t.dataset.ex){const id=t.dataset.ex,n=+t.dataset.n,st=setsOf(id,S.day)[n];st[t.dataset.f]=t.value;if(st.done){fillSet(id,n,st);record(id)}save();return}
  if(t.id==='nome'){S.profile.name=t.value.trim();save();return}
  if(t.id==='addq'){$('#addlist').innerHTML=addList(t.value);return}
  if(t.id==='bkin'){UI.bkin=t.value;if(UI.confirm){UI.confirm=false;const bt=document.querySelector('[data-act="bkrestore"]');bt.textContent='Restaurar backup';bt.classList.remove('primary')}}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')SH.hidden=true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
render();
</script>
